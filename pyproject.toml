[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "airoha-kb"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.entry-points."mkdocs.plugins"]
search_exclude = "search_exclude:SearchExcludePlugin"

[tool.setuptools]
py-modules = ["search_exclude"]
