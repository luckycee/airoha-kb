site_name: ABT 工单知识库
site_description: ABT 服务台工单知识库（ABT 系列）
repo_url: https://github.com/luckycee/airoha-kb
repo_name: 源码仓库

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.expand
    - navigation.indexes
    - search.suggest
    - search.highlight
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换浅色模式

plugins:
  - search:
      separator: '[\s​\-–—,，。;；:：、！？!?/\\()\[\]{}"'']+'
  # 自定义插件：导航页（工单列表/首页）不进入搜索索引，避免搜索噪音
  - search_exclude:
      pages:
        - tickets/list
        - index

# 内部文档（设计文档等）不进入公开站点
exclude_docs: |
  superpowers/


markdown_extensions:
  - admonition
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  social: []

nav:
  - 首页: index.md
  - 工单分类: tickets/index.md
  - 工单列表: tickets/list.md
