name: Sync Knowledge Base

on:
  schedule:
    - cron: '23 3 * * 1'      # 每周一 03:23 UTC（避开整点高峰）
  workflow_dispatch:          # 支持手动触发

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write   # Cookie 失效时创建通知 issue

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: 重建敏感词库（Secrets 加密存储，不提交到仓库）
        run: |
          cat > sensitive_words.txt << 'EOF'
          ${{ secrets.SENSITIVE_WORDS }}
          EOF

      - name: 写入登录 Cookie（Secrets 加密存储）
        run: |
          cat > cookies.txt << 'EOF'
          ${{ secrets.COOKIES }}
          EOF

      - name: 恢复 raw 缓存（避免每周重新下载全部工单）
        uses: actions/cache@v4
        with:
          path: raw
          key: raw-${{ github.run_date }}
          restore-keys: raw-

      - name: 增量抓取新工单
        run: python scripts/download_raw.py --range 15 999 --delay 0.8
        continue-on-error: true

      - name: 收集人名并全量解析
        run: |
          python scripts/collect_names.py || true
          python scripts/parse.py
          python scripts/build_index.py

      - name: 构建站点
        run: python -m mkdocs build

      - name: 提交内容变更（若有）
        run: |
          git config user.name "kb-bot"
          git config user.email "kb-bot@users.noreply.github.com"
          git pull --rebase origin master || echo "rebase 失败，尝试直接提交"
          git add -A
          git commit -m "chore: 增量同步工单 $(date +%F)" || echo "无变更"
          git push --force-with-lease || git push

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages

      - name: Cookie 失效通知
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Cookie 已过期，需要更新',
              body: '增量同步失败：登录 Cookie 已失效。请在 Settings → Secrets and variables → Actions 中更新 COOKIES，然后在 Actions 页面手动触发 Sync Knowledge Base。'
            })
